<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 用例工作台 — AITest Hub</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23e0685a%27/%3E%3Cstop offset=%271%27 stop-color=%27%23d98e2b%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27 transform=%27rotate(-4 16 16)%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 font-weight=%27800%27 font-family=%27sans-serif%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAT%3C/text%3E%3C/svg%3E">
</head>
<body data-require-login>

<div class="workspace">
  <aside class="sidebar"></aside>
  <main class="main-area">
    <div class="breadcrumb"><a href="app.html">工具台</a> / AI 用例工作台</div>
    <div class="page-head">
      <div>
        <h1>🤖 AI 用例工作台</h1>
        <div class="sub">粘贴需求 → AI 生成结构化用例 → 会话精修 → 导出 Excel / Markdown</div>
      </div>
      <div class="flex">
        <button class="btn btn-ghost" id="btn-export-md">⬇️ 导出 Markdown</button>
        <button class="btn btn-ghost" id="btn-export-xlsx">⬇️ 导出 Excel</button>
        <button class="btn btn-primary" id="btn-save-suite">💾 保存用例集</button>
      </div>
    </div>

    <div class="grid" style="grid-template-columns: 340px 1fr; gap:14px">
      <!-- 左：需求输入 + 历史会话 -->
      <div>
        <div class="card">
          <div class="card-title">📋 需求输入 <span class="tag tag-purple">AI</span></div>
          <div class="field">
            <label>需求来源</label>
            <select class="select" id="src-type">
              <option value="text">📝 粘贴需求文本</option>
              <option value="lanhu">🎨 蓝湖需求链接</option>
              <option value="file">📎 上传附件（PRD / 图片）</option>
            </select>
          </div>
          <div class="field" id="src-text-wrap">
            <label>需求描述 <span class="text-red">*</span></label>
            <textarea class="textarea" id="req-text" rows="7" placeholder="粘贴 PRD 需求描述，或输入功能点说明…&#10;&#10;示例：用户在订单详情页点击「申请退款」，可选择退款原因（必填，7 项枚举），填写退款说明（选填，最多 200 字），提交后进入审核，审核通过后 1-3 个工作日原路退回。">订单退款功能需求：
1. 用户在订单详情页点击「申请退款」按钮，进入退款申请页
2. 退款原因为必填下拉框，共 7 项枚举（不想要了/拍错了/质量问题/与描述不符/未按约定时间发货/其他/商家原因）
3. 退款说明为选填文本框，最多 200 字，超出禁止输入
4. 提交后生成退款单，状态为「待审核」，可撤销
5. 审核通过后 1-3 个工作日原路退回；拒绝后可重新申请</textarea>
          </div>
          <div class="field hidden" id="src-lanhu-wrap">
            <label>蓝湖项目链接 <span class="text-red">*</span></label>
            <input class="input" id="lanhu-url" placeholder="https://lanhuapp.com/url/xxxxx">
            <div class="hint">AI 将自动拉取页面与交互说明</div>
          </div>
          <div class="field hidden" id="src-file-wrap">
            <label>附件</label>
            <div class="card" style="border-style:dashed; text-align:center; padding:18px; cursor:pointer" id="file-drop">
              <div style="font-size:22px">📎</div>
              <div class="text-dim mt-8" style="font-size:12.5px">点击选择或拖拽文件到此处</div>
              <div class="text-faint" style="font-size:11.5px">支持 PDF / Word / PNG，≤ 10MB</div>
            </div>
            <div id="file-list" class="mt-8"></div>
            <input type="file" id="file-input" class="hidden" multiple accept=".pdf,.doc,.docx,.png,.jpg">
          </div>
          <div class="field">
            <label>用例生成风格</label>
            <div class="flex" style="gap:8px; flex-wrap:wrap">
              <label class="checkbox"><input type="checkbox" checked value="功能"> 功能用例</label>
              <label class="checkbox"><input type="checkbox" checked value="边界"> 边界分析</label>
              <label class="checkbox"><input type="checkbox" value="异常"> 异常流</label>
              <label class="checkbox"><input type="checkbox" value="接口"> 接口用例</label>
            </div>
          </div>
          <button class="btn btn-primary" id="btn-generate" style="width:100%">✨ AI 生成用例</button>
        </div>

        <div class="card mt-16">
          <div class="card-title">🕘 历史用例集 <button class="btn btn-sm btn-ghost" id="history-clear">清空</button></div>
          <div id="history-list" style="display:flex; flex-direction:column; gap:6px"></div>
        </div>
      </div>

      <!-- 右：AI 会话 + 用例表 -->
      <div>
        <div class="card">
          <div class="card-title">💬 AI 会话 <span class="tag tag-green" id="ai-status"><span class="dot dot-green"></span>就绪</span></div>
          <div class="chat-box" id="chat-box" style="min-height:120px; max-height:260px; overflow-y:auto; margin-bottom:14px">
            <div class="msg ai">
              <div class="m-avatar">🤖</div>
              <div class="m-body">你好，我是用例生成助手。请在左侧粘贴需求或填写蓝湖链接，选择生成风格后点击「AI 生成用例」。生成后你可以继续对话精修，例如：<b>“补充支付失败场景”</b>、<b>“边界值再细化”</b>。</div>
            </div>
          </div>
          <div class="input-group">
            <input class="input" id="chat-input" placeholder="输入精修指令，如：补充退款审核拒绝的异常场景…">
            <button class="btn btn-primary" id="chat-send">发送</button>
          </div>
        </div>

        <div class="card mt-16">
          <div class="flex-between mb-8">
            <div class="card-title" style="margin:0">📝 生成的用例 <span class="tag tag-blue" id="case-count">0 条</span></div>
            <div class="flex">
              <input class="input" id="case-search" placeholder="🔍 搜索用例…" style="width:180px; padding:5px 10px; font-size:12.5px">
              <select class="select" id="case-priority" style="width:110px; padding:5px 10px; font-size:12.5px">
                <option value="">全部优先级</option><option>P0</option><option>P1</option><option>P2</option>
              </select>
            </div>
          </div>
          <div id="case-table-wrap"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 用例查看/编辑弹窗 -->
<div class="modal-mask" id="modal-case">
  <div class="modal modal-lg">
    <div class="modal-head"><h3 id="case-modal-title">查看用例</h3><button class="modal-close" data-close-modal>✕</button></div>
    <div class="modal-body">
      <div class="grid grid-2" style="gap:12px">
        <div class="field"><label>用例标题</label><input class="input" id="edit-title"></div>
        <div class="field"><label>优先级</label><select class="select" id="edit-priority"><option>P0</option><option>P1</option><option>P2</option></select></div>
      </div>
      <div class="field"><label>前置条件</label><input class="input" id="edit-pre"></div>
      <div class="field"><label>操作步骤</label><textarea class="textarea" id="edit-steps" rows="4"></textarea></div>
      <div class="field"><label>预期结果</label><textarea class="textarea" id="edit-expected" rows="3"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="case-delete">🗑 删除</button>
      <button class="btn btn-ghost" data-close-modal>取消</button>
      <button class="btn btn-primary" id="case-save">💾 保存</button>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
(function () {
  var cases = [];
  var editingIdx = -1;

  /* ---------- 知识库「套用测试模式」跳转：消费 ?pattern= 预填需求源 ---------- */
  var pat = (typeof qs === "function") ? qs("pattern") : null;
  if (pat) {
    var reqBox = document.getElementById("req-text");
    if (reqBox && !/（此处粘贴需求描述…）/.test(reqBox.value)) {
      reqBox.value = "请按照测试模式「" + pat + "」的要点，为该功能生成测试用例：\n（此处粘贴需求描述…）";
    }
    var srcSel = document.getElementById("src-type");
    if (srcSel) { srcSel.value = "text"; srcSel.dispatchEvent(new Event("change")); }
    setTimeout(function () { toast("已套用测试模式「" + pat + "」，请补充需求描述后生成", "info"); }, 400);
    if (typeof setQs === "function") setQs("pattern", null);
  }

  /* ---------- 需求来源切换 ---------- */
  document.getElementById("src-type").addEventListener("change", function () {
    var v = this.value;
    document.getElementById("src-text-wrap").classList.toggle("hidden", v !== "text");
    document.getElementById("src-lanhu-wrap").classList.toggle("hidden", v !== "lanhu");
    document.getElementById("src-file-wrap").classList.toggle("hidden", v !== "file");
  });

  /* ---------- 附件 ---------- */
  var files = [];
  var drop = document.getElementById("file-drop"), fin = document.getElementById("file-input");
  drop.addEventListener("click", function () { fin.click(); });
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.style.borderColor = "var(--primary)"; });
  drop.addEventListener("dragleave", function () { drop.style.borderColor = ""; });
  drop.addEventListener("drop", function (e) { e.preventDefault(); addFiles(e.dataTransfer.files); });
  fin.addEventListener("change", function () { addFiles(fin.files); });
  function addFiles(list) {
    for (var i = 0; i < list.length; i++) files.push(list[i].name);
    renderFiles();
    toast("已添加 " + list.length + " 个附件", "success");
  }
  function renderFiles() {
    document.getElementById("file-list").innerHTML = files.map(function (f, i) {
      return '<span class="tag tag-blue" style="margin-right:6px">📎 ' + f +
        ' <button style="background:none;border:none;color:inherit;cursor:pointer" data-rm="' + i + '">✕</button></span>';
    }).join("");
    document.querySelectorAll("[data-rm]").forEach(function (b) {
      b.addEventListener("click", function () { files.splice(+b.dataset.rm, 1); renderFiles(); });
    });
  }

  /* ---------- 生成用例 ---------- */
  function addMsg(text, who, streaming) {
    var box = document.getElementById("chat-box");
    var div = document.createElement("div");
    div.className = "msg " + (who === "user" ? "user" : "ai");
    div.innerHTML = '<div class="m-avatar">' + (who === "user" ? "🙂" : "🤖") + '</div><div class="m-body">' + text + "</div>";
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  var SEED_CASES = [
    { title: "正常提交退款申请", pri: "P0", pre: "用户已登录，存在可退款订单", steps: "1. 进入订单详情页\n2. 点击「申请退款」\n3. 选择退款原因「不想要了」\n4. 填写退款说明\n5. 点击提交", exp: "生成退款单，状态为「待审核」，页面提示提交成功" },
    { title: "退款原因边界：不选择直接提交", pri: "P0", pre: "用户已登录，进入退款申请页", steps: "1. 不选择退款原因\n2. 直接点击「提交」", exp: "提交失败，提示「请选择退款原因」，退款原因下拉框高亮" },
    { title: "退款说明 200 字边界", pri: "P1", pre: "用户已进入退款申请页", steps: "1. 退款说明输入 200 字\n2. 尝试继续输入第 201 字", exp: "第 201 字无法输入，字数统计显示 200/200" },
    { title: "退款说明 0 字（选填）提交", pri: "P2", pre: "用户已进入退款申请页", steps: "1. 仅选择退款原因\n2. 退款说明留空\n3. 提交", exp: "提交成功，生成待审核退款单" },
    { title: "提交后撤销退款单", pri: "P1", pre: "存在一条「待审核」退款单", steps: "1. 进入退款单列表\n2. 点击「撤销」\n3. 确认撤销", exp: "退款单状态变更为「已撤销」，订单恢复可购买状态" },
    { title: "审核通过后原路退回", pri: "P0", pre: "存在待审核退款单，审核人员已登录后台", steps: "1. 后台审核通过\n2. 等待退款处理", exp: "1-3 个工作日内原路退回，退款单状态为「已退款」，用户收到退款通知" },
    { title: "审核拒绝后重新申请", pri: "P1", pre: "存在被拒绝的退款单", steps: "1. 查看拒绝原因\n2. 重新发起退款申请", exp: "可正常进入申请页并重新提交，生成新的退款单" },
    { title: "7 项退款原因枚举逐一校验", pri: "P1", pre: "用户已进入退款申请页", steps: "1. 依次选择 7 项退款原因\n2. 每次选择后提交", exp: "7 项均可正常选择并提交成功，枚举与需求一致无缺漏" },
    { title: "未登录状态点击申请退款", pri: "P0", pre: "用户未登录", steps: "1. 直接访问退款申请页 URL", exp: "跳转登录页，登录后回跳退款申请页" },
    { title: "重复提交防抖校验", pri: "P2", pre: "用户已进入退款申请页", steps: "1. 快速连续点击「提交」按钮 5 次", exp: "仅生成 1 条退款单，按钮置灰防重复提交" }
  ];

  document.getElementById("btn-generate").addEventListener("click", function () {
    var src = document.getElementById("src-type").value;
    var text = document.getElementById("req-text").value.trim();
    if (src === "text" && !text) return toast("请先填写需求描述", "error");
    if (src === "lanhu" && !/^https?:\/\//.test(document.getElementById("lanhu-url").value.trim())) return toast("请填写合法的蓝湖链接", "error");
    if (src === "file" && !files.length) return toast("请上传至少一个附件", "error");

    var btn = this;
    btn.disabled = true;
    document.getElementById("ai-status").innerHTML = '<span class="dot" style="background:var(--purple)"></span>流式生成中…';
    addMsg("正在解析需求并生成用例…", "ai");
    var tips = addMsg('<span class="typing-dots"><span></span><span></span><span></span></span> AI 正在分析需求要点：退款原因枚举、字数边界、状态流转…', "ai", true);

    setTimeout(function () {
      tips.querySelector(".m-body").innerHTML = "✅ 需求解析完成，共生成 <b>10</b> 条用例（P0×4 / P1×4 / P2×2）。已写入下方用例表，可点击行内「编辑」精修。";
      cases = SEED_CASES.map(function (c, i) { return Object.assign({ id: "TC-" + (1001 + i) }, c); });
      renderCases(); saveHistory(text || "蓝湖需求解析");
      btn.disabled = false;
      document.getElementById("ai-status").innerHTML = '<span class="dot dot-green"></span>就绪';
      toast("AI 用例生成完成：10 条", "success");
    }, 1800);
  });

  /* ---------- 用例表 ---------- */
  function filtered() {
    var kw = document.getElementById("case-search").value.trim().toLowerCase();
    var pri = document.getElementById("case-priority").value;
    return cases.filter(function (c) {
      return (!kw || (c.title + c.steps).toLowerCase().indexOf(kw) >= 0) && (!pri || c.pri === pri);
    });
  }
  function renderCases() {
    document.getElementById("case-count").textContent = cases.length + " 条";
    var list = filtered();
    var wrap = document.getElementById("case-table-wrap");
    if (!cases.length) {
      wrap.innerHTML = '<div class="empty"><div class="e-icon">📝</div><div class="e-text">暂无用例，点击左侧「AI 生成用例」开始</div></div>';
      return;
    }
    var html = '<div class="table-wrap"><table class="table"><thead><tr><th style="width:90px">编号</th><th>标题</th><th style="width:60px">优先级</th><th style="width:150px">前置条件</th><th style="width:120px">操作</th></tr></thead><tbody>';
    if (!list.length) html += '<tr><td colspan="5"><div class="empty" style="padding:24px"><div class="e-text">无匹配用例</div></div></td></tr>';
    list.forEach(function (c) {
      var tagCls = c.pri === "P0" ? "tag-red" : c.pri === "P1" ? "tag-orange" : "tag";
      html += "<tr><td class=\"mono\">" + c.id + "</td>" +
        '<td><div class="cell-main">' + c.title + "</div>" +
        '<td><span class="tag ' + tagCls + '">' + c.pri + "</span></td>" +
        '<td class="cell-sub">' + c.pre + "</td>" +
        '<td><div class="row-actions"><button class="btn btn-sm btn-ghost" data-edit="' + c.id + '">编辑</button></div></td></tr>';
    });
    html += "</tbody></table></div>";
    wrap.innerHTML = html;
    wrap.querySelectorAll("[data-edit]").forEach(function (b) {
      b.addEventListener("click", function () { openEdit(b.dataset.edit); });
    });
  }
  document.getElementById("case-search").addEventListener("input", debounce(renderCases, 200));
  document.getElementById("case-priority").addEventListener("change", renderCases);

  function openEdit(id) {
    editingIdx = cases.findIndex(function (c) { return c.id === id; });
    var c = cases[editingIdx];
    document.getElementById("case-modal-title").textContent = "编辑用例 · " + c.id;
    document.getElementById("edit-title").value = c.title;
    document.getElementById("edit-priority").value = c.pri;
    document.getElementById("edit-pre").value = c.pre;
    document.getElementById("edit-steps").value = c.steps;
    document.getElementById("edit-expected").value = c.exp;
    openModal("modal-case");
  }
  document.getElementById("case-save").addEventListener("click", function () {
    var c = cases[editingIdx];
    c.title = document.getElementById("edit-title").value || c.title;
    c.pri = document.getElementById("edit-priority").value;
    c.pre = document.getElementById("edit-pre").value;
    c.steps = document.getElementById("edit-steps").value;
    c.exp = document.getElementById("edit-expected").value;
    closeModal("modal-case"); renderCases(); toast("用例已保存", "success");
  });
  document.getElementById("case-delete").addEventListener("click", function () {
    var c = cases[editingIdx];
    confirmAction({ title: "删除用例", message: "确定删除用例「" + c.title + "」吗？", onOk: function () {
      cases.splice(editingIdx, 1); closeModal("modal-case"); renderCases(); toast("用例已删除", "success");
    }});
  });

  /* ---------- 会话精修 ---------- */
  function sendChat() {
    var inp = document.getElementById("chat-input");
    var text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    addMsg(text, "user");
    var tip = addMsg('<span class="typing-dots"><span></span><span></span><span></span></span>', "ai");
    setTimeout(function () {
      var extra = { title: "退款金额超限异常校验", pri: "P1", pre: "退款金额大于订单实付金额", steps: "1. 构造退款金额超限请求\n2. 提交退款申请", exp: "接口返回错误码 40021，提示「退款金额超出可退上限」" };
      if (/补充|异常/.test(text)) {
        tip.querySelector(".m-body").innerHTML = "好的，已补充异常场景用例 <b>TC-" + (1001 + cases.length) + "</b>「" + extra.title + "」并写入用例表。还需要继续细化其他场景吗？";
        cases.push(Object.assign({ id: "TC-" + (1001 + cases.length) }, extra));
        renderCases();
      } else {
        tip.querySelector(".m-body").innerHTML = "已收到你的精修指令：「" + text + "」。演示环境中我将围绕当前 10 条用例进行改写，你也可以直接点击表格中的「编辑」逐条调整。";
      }
      var box = document.getElementById("chat-box");
      box.scrollTop = box.scrollHeight;
    }, 1200);
  }
  document.getElementById("chat-send").addEventListener("click", sendChat);
  document.getElementById("chat-input").addEventListener("keydown", function (e) { if (e.key === "Enter") sendChat(); });

  /* ---------- 历史 ---------- */
  function getHistory() { try { return JSON.parse(localStorage.getItem("aitesthub_history") || "[]"); } catch (e) { return []; } }
  function saveHistory(name) {
    var h = getHistory();
    h.unshift({ name: (name || "需求").slice(0, 18) + "…", time: new Date().toLocaleString("zh-CN", { hour12: false }), count: cases.length });
    h = h.slice(0, 8);
    localStorage.setItem("aitesthub_history", JSON.stringify(h));
    renderHistory();
  }
  function renderHistory() {
    var h = getHistory();
    document.getElementById("history-list").innerHTML = h.length ? h.map(function (it) {
      return '<div class="flex-between" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px">' +
        '<div><div style="font-size:13px">' + it.name + '</div><div class="text-faint" style="font-size:11.5px">' + it.time + " · " + it.count + " 条</div></div>" +
        '<button class="btn btn-sm btn-ghost" onclick="toast(\'演示环境：加载历史用例集\',\'info\')">载入</button></div>';
    }).join("") : '<div class="text-faint" style="font-size:12.5px; padding:8px">暂无历史记录</div>';
  }
  document.getElementById("history-clear").addEventListener("click", function () {
    confirmAction({ title: "清空历史", message: "确定清空全部历史用例集记录吗？", onOk: function () {
      localStorage.removeItem("aitesthub_history"); renderHistory(); toast("历史已清空", "success");
    }});
  });

  /* ---------- 导出 / 保存 ---------- */
  document.getElementById("btn-export-md").addEventListener("click", function () {
    if (!cases.length) return toast("暂无用例可导出", "warn");
    toast("test-cases.md 导出成功（演示，" + cases.length + " 条）", "success");
  });
  document.getElementById("btn-export-xlsx").addEventListener("click", function () {
    if (!cases.length) return toast("暂无用例可导出", "warn");
    toast("test-cases.xlsx 导出成功（演示，" + cases.length + " 条）", "success");
  });
  document.getElementById("btn-save-suite").addEventListener("click", function () {
    if (!cases.length) return toast("暂无用例可保存", "warn");
    saveHistory("会话保存-" + new Date().toLocaleTimeString("zh-CN", { hour12: false }));
    toast("用例集已保存", "success");
  });

  renderCases(); renderHistory();
})();
</script>
</body>
</html>
