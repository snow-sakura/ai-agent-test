<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缺陷管理 — AITest Hub</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23e0685a%27/%3E%3Cstop offset=%271%27 stop-color=%27%23d98e2b%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27 transform=%27rotate(-4 16 16)%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 font-weight=%27800%27 font-family=%27sans-serif%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAT%3C/text%3E%3C/svg%3E">
</head>
<body data-require-login>

<div class="workspace">
  <aside class="sidebar"></aside>
  <main class="main-area">
    <div class="breadcrumb"><a href="app.html">工具台</a> / 缺陷管理</div>
    <div class="page-head">
      <div>
        <h1>🐞 缺陷管理</h1>
        <div class="sub">缺陷全生命周期流转 · 严重等级矩阵 · AI 重复缺陷检测 · 关联用例与执行记录</div>
      </div>
      <div class="flex">
        <a class="btn btn-ghost" href="tool-case-management.html">🗂️ 关联用例</a>
        <button class="btn btn-primary" data-open-modal="modal-defect">＋ 提交缺陷</button>
      </div>
    </div>

    <!-- 统计卡 -->
    <div class="grid grid-4 mb-16">
      <div class="card stat-card"><div class="s-label">新增（待处理）</div><div class="s-value" style="color:var(--orange)" id="st-new">0</div></div>
      <div class="card stat-card"><div class="s-label">处理中</div><div class="s-value" style="color:var(--blue)" id="st-fixing">0</div></div>
      <div class="card stat-card"><div class="s-label">待回归验证</div><div class="s-value" style="color:var(--purple)" id="st-verify">0</div></div>
      <div class="card stat-card"><div class="s-label">本周已关闭</div><div class="s-value" style="color:var(--green)" id="st-closed">0</div></div>
    </div>

    <div class="tabs" data-scope="dm">
      <button class="tab active" data-tab="list">📋 缺陷列表 <span class="badge-count" id="dm-cnt">0</span></button>
      <button class="tab" data-tab="board">📊 状态看板</button>
    </div>

    <div id="dm">
      <!-- ============ 缺陷列表 ============ -->
      <div class="tab-pane active" data-pane="list">
        <div class="filter-bar">
          <input class="input search" id="d-kw" placeholder="🔍 搜索标题 / 编号">
          <select class="select" id="d-status"><option value="">全部状态</option><option>新建</option><option>处理中</option><option>待验证</option><option>已关闭</option><option>已拒绝</option></select>
          <select class="select" id="d-sev"><option value="">全部严重等级</option><option>S0 致命</option><option>S1 严重</option><option>S2 一般</option><option>S3 轻微</option></select>
          <button class="btn btn-ghost btn-sm" id="d-reset">重置</button>
        </div>
        <div id="d-table"></div>
      </div>

      <!-- ============ 状态看板 ============ -->
      <div class="tab-pane" data-pane="board">
        <div class="grid grid-4" id="board"></div>
      </div>
    </div>
  </main>
</div>

<!-- 提交/编辑缺陷弹窗 -->
<div class="modal-mask" id="modal-defect">
  <div class="modal modal-lg">
    <div class="modal-head"><h3 id="df-modal-title">＋ 提交缺陷</h3><button class="modal-close" data-close-modal>✕</button></div>
    <div class="modal-body">
      <div class="grid grid-2" style="gap:12px">
        <div class="field"><label>缺陷标题 <span class="text-red">*</span></label><input class="input" id="fd-title" placeholder="环境+模块+现象，如：TEST·支付·支付成功但订单状态未更新"></div>
        <div class="field"><label>所属模块</label><select class="select" id="fd-module"><option>支付模块</option><option>订单模块</option><option>用户模块</option><option>库存模块</option></select></div>
      </div>
      <div class="grid grid-2" style="gap:12px">
        <div class="field"><label>严重等级</label>
          <select class="select" id="fd-sev"><option>S0 致命</option><option>S1 严重</option><option selected>S2 一般</option><option>S3 轻微</option></select>
        </div>
        <div class="field"><label>优先级</label><select class="select" id="fd-pri"><option>P0</option><option>P1</option><option selected>P2</option><option>P3</option></select></div>
      </div>
      <div class="field"><label>复现环境</label><select class="select" id="fd-env"><option>TEST</option><option>DEV</option><option>STAGING</option><option>生产</option></select></div>
      <div class="field"><label>复现步骤 <span class="text-red">*</span></label><textarea class="textarea" id="fd-steps" rows="4" placeholder="1. 进入…&#10;2. 点击…&#10;3. 观察…"></textarea></div>
      <div class="grid grid-2" style="gap:12px">
        <div class="field"><label>实际结果</label><textarea class="textarea" id="fd-actual" rows="2"></textarea></div>
        <div class="field"><label>期望结果</label><textarea class="textarea" id="fd-expected" rows="2"></textarea></div>
      </div>
      <div class="field"><label>关联用例</label>
        <select class="select" id="fd-case"><option value="">不关联</option><option>TC-1004 · 支付金额与订单一致校验</option><option>TC-1001 · 正常提交退款申请</option><option>TC-1007 · 库存为0时禁止下单</option></select>
      </div>
      <div class="field"><label>附件截图</label>
        <div class="card" style="border-style:dashed; text-align:center; padding:14px; cursor:pointer" id="df-upload">
          <span class="text-dim" style="font-size:12.5px">📎 点击上传截图 / 日志（≤ 5 个）</span>
        </div>
        <input type="file" id="df-file" class="hidden" multiple accept="image/*,.log,.txt">
        <div id="df-files" class="mt-8"></div>
      </div>
      <button class="btn btn-ghost btn-sm" id="fd-ai-dup">🤖 AI 查重检测</button>
      <div id="fd-dup-result" class="mt-8"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close-modal>取消</button>
      <button class="btn btn-primary" id="fd-save">💾 提交缺陷</button>
    </div>
  </div>
</div>

<!-- 缺陷详情弹窗 -->
<div class="modal-mask" id="modal-defect-view">
  <div class="modal modal-lg">
    <div class="modal-head"><h3 id="dv-title">缺陷详情</h3><button class="modal-close" data-close-modal>✕</button></div>
    <div class="modal-body">
      <div class="flex mb-16" id="dv-meta"></div>
      <div class="grid grid-2" style="gap:12px">
        <div class="field"><label>复现步骤</label><div class="code-block" id="dv-steps"></div></div>
        <div>
          <div class="field"><label>实际结果</label><div class="code-block" id="dv-actual"></div></div>
          <div class="field"><label>期望结果</label><div class="code-block" id="dv-expected"></div></div>
        </div>
      </div>
      <div class="card-title" style="font-size:13.5px">💬 处理记录</div>
      <div id="dv-timeline" style="display:flex; flex-direction:column; gap:10px"></div>
      <div class="input-group mt-16">
        <input class="input" id="dv-comment" placeholder="添加处理备注…">
        <button class="btn btn-primary" id="dv-comment-btn">发送</button>
      </div>
    </div>
    <div class="modal-foot" id="dv-actions"></div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
(function () {
  var SEV_CLS = { "S0 致命": "tag-red", "S1 严重": "tag-orange", "S2 一般": "tag-blue", "S3 轻微": "tag" };
  var ST_CLS = { "新建": "tag-orange", "处理中": "tag-blue", "待验证": "tag-purple", "已关闭": "tag-green", "已拒绝": "tag" };
  // 状态流转：新建→处理中→待验证→已关闭；新建/处理中可拒绝
  var NEXT = { "新建": ["处理中", "已拒绝"], "处理中": ["待验证", "已拒绝"], "待验证": ["已关闭", "处理中"], "已关闭": [], "已拒绝": ["新建"] };

  var defects = [];
  var japi = function (method, url, data) {
    var opt = { method: method, headers: { "Content-Type": "application/json" } };
    var tk = localStorage.getItem("aitesthub_token");
    if (tk) opt.headers["Authorization"] = "Bearer " + tk;
    if (data !== undefined) opt.body = JSON.stringify(data);
    return fetch(url, opt).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error((j && j.detail) || ("HTTP " + r.status)); return j; });
    });
  };
  var gv = function (id) { return document.getElementById(id).value; };
  var reload = function () {
    return japi("GET", "/api/bugs").then(function (l) { defects = l; refreshAll(); return l; })
      .catch(function (e) { toast((e && e.message) || "network error", "error"); });
  };
  var loadBug = function (id) {
    return japi("GET", "/api/bugs/" + encodeURIComponent(id)).then(function (r) { comments[id] = r.comments; return r; });
  };
  var persistBug = function (x, cb) {
    japi("PATCH", "/api/bugs/" + encodeURIComponent(x.id), { status: x.status, assignee: x.assignee })
      .then(function () { return reload(); }).then(cb).catch(function (e) { toast((e && e.message) || "network error", "error"); });
  };
  var persistThenClose = function (x) { persistBug(x, function () { closeModal("modal-defect-view"); }); };


  /* ---------- 统计 ---------- */
  function renderStats() {
    document.getElementById("st-new").textContent = defects.filter(function (d) { return d.status === "新建"; }).length;
    document.getElementById("st-fixing").textContent = defects.filter(function (d) { return d.status === "处理中"; }).length;
    document.getElementById("st-verify").textContent = defects.filter(function (d) { return d.status === "待验证"; }).length;
    document.getElementById("st-closed").textContent = defects.filter(function (d) { return d.status === "已关闭"; }).length;
    document.getElementById("dm-cnt").textContent = defects.length;
  }

  /* ---------- 列表 ---------- */
  function renderTable() {
    var kw = document.getElementById("d-kw").value.trim().toLowerCase();
    var st = document.getElementById("d-status").value;
    var sv = document.getElementById("d-sev").value;
    var d = defects.filter(function (x) {
      return (!kw || (x.title + x.id).toLowerCase().indexOf(kw) >= 0) && (!st || x.status === st) && (!sv || x.sev === sv);
    });
    var html = '<div class="table-wrap"><table class="table"><thead><tr><th>编号</th><th>标题</th><th>严重等级</th><th>状态</th><th>处理人</th><th>关联用例</th><th>提交时间</th><th style="width:120px">操作</th></tr></thead><tbody>';
    if (!d.length) html += '<tr><td colspan="8"><div class="empty"><div class="e-icon">🐞</div><div class="e-text">无匹配缺陷</div></div></td></tr>';
    d.forEach(function (x) {
      html += '<tr><td class="mono">' + x.id + "</td>" +
        '<td><div class="cell-main">' + x.title + '</div><div class="cell-sub">' + x.reporter + " · " + x.env + "</div></td>" +
        '<td><span class="tag ' + SEV_CLS[x.sev] + '">' + x.sev + "</span></td>" +
        '<td><span class="tag ' + ST_CLS[x.status] + '">' + x.status + "</span></td>" +
        "<td>" + x.assignee + "</td>" +
        "<td>" + (x.case ? '<a href="tool-case-management.html" class="mono">' + x.case + "</a>" : '<span class="text-faint">—</span>') + "</td>" +
        '<td class="mono" style="font-size:12px">' + x.time + "</td>" +
        '<td><div class="row-actions" style="opacity:1">' +
        '<button class="btn btn-sm btn-ghost" data-view="' + x.id + '">详情</button>' +
        '<button class="btn btn-sm btn-ghost" data-edit="' + x.id + '">编辑</button></div></td></tr>';
    });
    html += "</tbody></table></div>";
    document.getElementById("d-table").innerHTML = html;
    document.querySelectorAll("#d-table [data-view]").forEach(function (b) { b.addEventListener("click", function () { openDetail(b.dataset.view); }); });
    document.querySelectorAll("#d-table [data-edit]").forEach(function (b) {
      b.addEventListener("click", function () {
        var x = defects.find(function (d2) { return d2.id === b.dataset.edit; });
        document.getElementById("df-modal-title").textContent = "编辑缺陷 · " + x.id;
        document.getElementById("fd-title").value = x.title;
        document.getElementById("fd-steps").value = x.steps;
        document.getElementById("fd-actual").value = x.actual;
        document.getElementById("fd-expected").value = x.expected;
        openModal("modal-defect");
      });
    });
  }
  document.getElementById("d-kw").addEventListener("input", debounce(renderTable, 200));
  document.getElementById("d-status").addEventListener("change", renderTable);
  document.getElementById("d-sev").addEventListener("change", renderTable);
  document.getElementById("d-reset").addEventListener("click", function () {
    document.getElementById("d-kw").value = ""; document.getElementById("d-status").value = ""; document.getElementById("d-sev").value = "";
    renderTable(); toast("筛选已重置", "info");
  });

  /* ---------- 看板 ---------- */
  function renderBoard() {
    var cols = ["新建", "处理中", "待验证", "已关闭"];
    document.getElementById("board").innerHTML = cols.map(function (col) {
      var cards = defects.filter(function (x) { return x.status === col; });
      return '<div class="card" style="padding:14px; background:var(--panel-2)">' +
        '<div class="card-title" style="font-size:13px; margin-bottom:10px">' + col + ' <span class="tag">' + cards.length + "</span></div>" +
        '<div style="display:flex; flex-direction:column; gap:8px">' +
        (cards.length ? cards.map(function (x) {
          return '<div class="card" style="padding:10px; cursor:pointer" data-card="' + x.id + '">' +
            '<div style="font-size:12.5px; font-weight:600">' + x.title + "</div>" +
            '<div class="flex mt-8"><span class="tag ' + SEV_CLS[x.sev] + '" style="font-size:10.5px">' + x.sev + '</span><span class="text-faint mono" style="font-size:11px">' + x.id + "</span></div></div>";
        }).join("") : '<div class="text-faint" style="font-size:12px; text-align:center; padding:16px">空</div>') + "</div></div>";
    }).join("");
    document.querySelectorAll("[data-card]").forEach(function (c) {
      c.addEventListener("click", function () { openDetail(c.dataset.card); });
    });
  }

  /* ---------- 详情 + 流转 ---------- */
  var comments = {};
  function openDetail(id) {
    var x = defects.find(function (d) { return d.id === id; }); if (!x) return; loadBug(id).then(function () { renderTimeline(x); });
    document.getElementById("dv-title").textContent = x.id + " · " + x.title;
    document.getElementById("dv-meta").innerHTML =
      '<span class="tag ' + SEV_CLS[x.sev] + '">' + x.sev + '</span><span class="tag ' + ST_CLS[x.status] + '">' + x.status + "</span>" +
      '<span class="tag">环境 ' + x.env + '</span><span class="tag">报告人 ' + x.reporter + '</span><span class="tag">处理人 ' + x.assignee + "</span>" +
      (x.case ? '<a class="tag tag-blue" href="tool-case-management.html">🔗 ' + x.case + "</a>" : "");
    document.getElementById("dv-steps").textContent = x.steps;
    document.getElementById("dv-actual").textContent = x.actual;
    document.getElementById("dv-expected").textContent = x.expected;
    renderTimeline(x);
    // 流转按钮
    var acts = document.getElementById("dv-actions");
    acts.innerHTML = NEXT[x.status].map(function (s) {
      var cls = s === "已关闭" ? "btn-success" : s === "已拒绝" ? "btn-ghost" : "btn-primary";
      return '<button class="btn ' + cls + '" data-flow="' + s + '">→ ' + s + "</button>";
    }).join("") + '<button class="btn btn-ghost" data-close-modal>关闭</button>';
    acts.querySelectorAll("[data-flow]").forEach(function (b) {
      b.addEventListener("click", function () {
        var to = b.dataset.flow;
        if (to === "已拒绝") {
          confirmAction({ title: "拒绝缺陷", message: "确定拒绝「" + x.title + "」吗？需说明原因。", onOk: function () {
            x.status = "已拒绝"; toast("缺陷已拒绝", "warn"); persistThenClose(x);
          }});
        } else if (to === "已关闭") {
          confirmAction({ title: "关闭缺陷", message: "回归验证通过，确定关闭「" + x.id + "」吗？", danger: false, onOk: function () {
            x.status = "已关闭"; toast("缺陷已关闭 🎉", "success"); persistThenClose(x);
          }});
        } else {
          x.status = to;
          if (to === "处理中" && x.assignee === "未分配") x.assignee = "wxh";
          toast("状态已流转至「" + to + "」", "success"); persistBug(x, function () { openDetail(x.id); });
        }
      });
    });
    document.getElementById("dv-comment-btn").onclick = function () {
      var inp = document.getElementById("dv-comment");
      var v = inp.value.trim();
      if (!v) return toast("请输入备注内容", "warn");
      japi("POST", "/api/bugs/" + encodeURIComponent(x.id) + "/comments", { text: v })
        .then(function () { return loadBug(x.id); }).then(function () { renderTimeline(x); });
      inp.value = ""; toast("备注已添加", "success");
    };
    openModal("modal-defect-view");
  }
  function renderTimeline(x) {
    var base = [
      { by: x.reporter, text: "提交缺陷，当前状态「" + x.status + "」", time: x.time },
      (comments[x.id] || [])
    ].flat();
    document.getElementById("dv-timeline").innerHTML = base.map(function (m) {
      return '<div class="flex" style="gap:10px; align-items:flex-start"><span class="avatar" style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#e0685a,#d98e2b);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700">' + m.by.slice(0, 1) + '</span><div><div style="font-size:13px">' + m.text + '</div><div class="text-faint" style="font-size:11.5px">' + m.by + " · " + m.time + "</div></div></div>";
    }).join("");
  }

  /* ---------- 提交缺陷 ---------- */
  var dfFiles = [];
  document.getElementById("df-upload").addEventListener("click", function () { document.getElementById("df-file").click(); });
  document.getElementById("df-file").addEventListener("change", function () {
    for (var i = 0; i < this.files.length && dfFiles.length < 5; i++) dfFiles.push(this.files[i].name);
    if (dfFiles.length >= 5) toast("最多上传 5 个附件", "warn");
    renderDfFiles();
  });
  function renderDfFiles() {
    document.getElementById("df-files").innerHTML = dfFiles.map(function (f, i) {
      return '<span class="tag tag-blue" style="margin-right:6px">📎 ' + f + ' <button style="background:none;border:none;color:inherit;cursor:pointer" data-dfr="' + i + '">✕</button></span>';
    }).join("");
    document.querySelectorAll("[data-dfr]").forEach(function (b) {
      b.addEventListener("click", function () { dfFiles.splice(+b.dataset.dfr, 1); renderDfFiles(); });
    });
  }
  document.getElementById("fd-ai-dup").addEventListener("click", function () {
    var t = document.getElementById("fd-title").value.trim();
    if (!t) return toast("\u8bf7\u5148\u586b\u5199\u7f3a\u9677\u6807\u9898", "warn");
    toast("AI \u6b63\u5728\u4e0e\u5386\u53f2\u7f3a\u9677\u6bd4\u5bf9\u2026", "info");
    japi("POST", "/api/bugs/dup-check", { title: t, module: document.getElementById("fd-module").value }).then(function (r) {
      var el = document.getElementById("fd-dup-result");
      if (r.found) {
        el.innerHTML = '<div class="banner banner-warn" style="margin:0">\u26a0\ufe0f \u53d1\u73b0 1 \u6761\u9ad8\u76f8\u4f3c\u7f3a\u9677\uff1a<b>' + r.id + '\u300c' + r.title + '\u300d</b>\uff08\u76f8\u4f3c\u5ea6 ' + r.percent + '%\uff09\u3002\u8bf7\u786e\u8ba4\u662f\u5426\u4e3a\u91cd\u590d\u63d0\u4ea4\uff0c\u4ecd\u53ef\u7ee7\u7eed\u63d0\u4ea4\u4e3a\u65b0\u7f3a\u9677\u3002</div>';
      } else {
        el.innerHTML = '<div class="banner banner-ok" style="margin:0">\u2705 \u672a\u53d1\u73b0\u91cd\u590d\u7f3a\u9677\uff08\u6700\u9ad8\u76f8\u4f3c\u5ea6 ' + r.percent + '%\uff09\u3002</div>';
      }
    }).catch(function (e) { toast((e && e.message) || "network error", "error"); });
  });
  document.getElementById("fd-save").addEventListener("click", function () {
    var t = document.getElementById("fd-title").value.trim();
    if (!t) return toast("请填写缺陷标题", "error");
    if (!document.getElementById("fd-steps").value.trim()) return toast("请填写复现步骤", "error");
    japi("POST", "/api/bugs", { title: t, module: gv("fd-module"), sev: gv("fd-sev"), pri: gv("fd-pri"), env: gv("fd-env"), case: gv("fd-case").split(" \u00b7 ")[0] || "", steps: gv("fd-steps"), actual: gv("fd-actual") || "-", expected: gv("fd-expected") || "-", attachments: dfFiles.slice(0, 5) }).then(function () { return reload(); }).catch(function (e) { toast((e && e.message) || "network error", "error"); });
    closeModal("modal-defect");
    ["fd-title", "fd-steps", "fd-actual", "fd-expected"].forEach(function (id) { document.getElementById(id).value = ""; });
    dfFiles = []; renderDfFiles();
    refreshAll(); toast("缺陷已提交，等待分配处理人", "success");
  });

  function refreshAll() { renderStats(); renderTable(); renderBoard(); }

  if (qs("tab")) {
    var tb = document.querySelector('.tab[data-tab="' + qs("tab") + '"]');
    if (tb) tb.click();
  }

  reload();
})();
</script>
