<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — AITest Hub</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23e0685a%27/%3E%3Cstop offset=%271%27 stop-color=%27%23d98e2b%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27 transform=%27rotate(-4 16 16)%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 font-weight=%27800%27 font-family=%27sans-serif%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EAT%3C/text%3E%3C/svg%3E">
</head>
<body data-noinject-topbar>

<div class="auth-wrap">
  <!-- 左侧品牌区 -->
  <div class="auth-left">
    <div class="auth-brandline">
      <a class="brand" href="index.html"><span class="logo">AT</span>AITest Hub</a>
    </div>
    <div style="max-width:420px; position:relative; z-index:1">
      <h1 style="font-size:30px; line-height:1.35">AI 驱动的<br>测试工程师在线工具箱</h1>
      <p class="text-dim mt-16" style="font-size:14.5px">可视化压测 · AI 用例 · 提示词库 · UI 自动化 · 工具箱，五大能力浏览器打开即用。</p>
      <div class="grid grid-2 mt-24" style="gap:10px">
        <div class="card" style="padding:12px 14px"><span class="tag tag-blue">🧪 压测编排</span></div>
        <div class="card" style="padding:12px 14px"><span class="tag tag-purple">🤖 AI 用例</span></div>
        <div class="card" style="padding:12px 14px"><span class="tag tag-green">📚 提示词库</span></div>
        <div class="card" style="padding:12px 14px"><span class="tag tag-orange">🖱️ UI 自动化</span></div>
      </div>
    </div>
  </div>

  <!-- 右侧登录表单 -->
  <div class="auth-panel">
    <div class="auth-card">
      <div class="tabs" style="margin-bottom:18px">
        <button class="tab active" type="button">登录</button>
        <button class="tab" type="button" onclick="location.href='register.html' + (qs('redirect') ? '?redirect=' + encodeURIComponent(qs('redirect')) : '')">注册</button>
      </div>
      <h2>欢迎回来 👋</h2>
      <p class="sub">登录 AITest Hub，继续你的测试工作</p>

      <!-- 演示账号提示 -->
      <div class="demo-cred">
        <span>🎭 演示账号：<span class="mono" id="demo-acc">见「一键填充」</span> / <span class="mono">••••••</span></span>
        <button class="btn btn-sm btn-ghost" id="fill-btn">一键填充</button>
      </div>

      <form id="login-form" novalidate>
        <div class="field" id="f-account">
          <label for="account">手机号 / 账号</label>
          <input class="input" id="account" type="tel" placeholder="请输入手机号" maxlength="11" autocomplete="username">
          <div class="err-msg">请输入正确的 11 位手机号</div>
        </div>

        <div class="field" id="f-password">
          <label for="password">密码</label>
          <div class="relative">
            <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" style="padding-right:44px">
            <button type="button" class="pw-toggle" id="pw-toggle">👁</button>
          </div>
          <div class="err-msg">密码不能为空</div>
        </div>

        <div class="flex-between mb-16">
          <label class="checkbox"><input type="checkbox" id="remember" checked> 记住我</label>
          <a href="#" onclick="toast('演示环境：请联系管理员重置密码','info');return false" style="font-size:12.5px">忘记密码？</a>
        </div>

        <button class="btn btn-primary btn-lg" type="submit" id="login-btn" style="width:100%">登 录</button>

        <p class="text-faint mt-16" style="font-size:12.5px; text-align:center">
          没有账号？<a href="register.html">注册账号</a>
          · <a href="index.html">返回首页</a>
        </p>
      </form>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
(function () {
  var form = document.getElementById("login-form");
  var acc = document.getElementById("account");
  var pw = document.getElementById("password");
  var btn = document.getElementById("login-btn");

  // 一键填充演示账号（账号口令由后端 /api/config/demo-account 下发）
  document.getElementById("fill-btn").addEventListener("click", function () {
    Auth.demoCreds().then(function (c) {
      if (!c || !c.account) { toast("本环境未开放演示账号，请手动登录或注册", "warn"); return; }
      acc.value = c.account;
      pw.value = c.password;
      var hint = document.getElementById("demo-acc");
      if (hint) hint.textContent = c.account;
      clearErr("f-account"); clearErr("f-password");
      toast("已填充演示账号", "info");
    });
  });

  // 密码可见切换
  document.getElementById("pw-toggle").addEventListener("click", function () {
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    this.textContent = show ? "🙈" : "👁";
  });

  // 输入时清除错误
  acc.addEventListener("input", function () { clearErr("f-account"); });
  pw.addEventListener("input", function () { clearErr("f-password"); });

  function setErr(id, msg) {
    var f = document.getElementById(id);
    f.classList.add("has-err");
    if (msg) f.querySelector(".err-msg").textContent = msg;
  }
  function clearErr(id) { document.getElementById(id).classList.remove("has-err"); }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var ok = true;
    if (!/^1\d{10}$/.test(acc.value.trim())) { setErr("f-account"); ok = false; }
    if (!pw.value) { setErr("f-password"); ok = false; }
    if (!ok) { toast("请检查表单填写", "error"); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 登录中…';
    Auth.loginAPI(acc.value.trim(), pw.value).then(function () {
      if (document.getElementById("remember").checked) localStorage.setItem("aitesthub_remember", acc.value);
      toast("登录成功，欢迎回来！", "success");
      setTimeout(function () { location.href = qs("redirect") || "index.html"; }, 500);
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = "登 录";
      var msg = (err && err.message) ? err.message : "账号或密码错误";
      setErr("f-password", msg);
      toast("登录失败：" + msg, "error");
    });
  });

  // 记住我回填
  var remembered = localStorage.getItem("aitesthub_remember");
  if (remembered) acc.value = remembered;
})();
</script>
</body>
</html>
